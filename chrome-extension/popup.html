<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: "Segoe UI", sans-serif; width: 220px; padding: 14px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .hint { font-size: 11px; color: #777; margin-top: 10px; line-height: 1.4; }
    .status { font-size: 11px; margin-top: 6px; }
    .status.on { color: #1a7f37; }
    .status.off { color: #999; }
  </style>
</head>
<body>
  <h1>Wispr Lite</h1>
  <label>
    <input type="checkbox" id="toggle" />
    Enabled
  </label>
  <div class="status" id="status"></div>
  <div class="hint">When enabled, press <b>Ctrl+Shift+Space</b> anywhere to dictate. Disabling stops the local process.</div>
  <script src="popup.js"></script>
</body>
</html>
